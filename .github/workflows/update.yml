name: Update github-pages
on:
  push:
    branches:
      - master

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout github-pages branch
        uses: actions/checkout@v2
        with:
          ref: github-pages

      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 22.x

      - name: Delete /docs folder
        run: npm run delete-docs

      - name: Commit changes
        uses: EndBug/add-and-commit@v7
        with:
          author_name: GuyHarperDay
          author_email:
          message: 'Deleting docs directory'
          branch: github-pages

      - name: Checkout master branch
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm ci --engine-strict=false

      - name: Build
        run: npm run build

      - name: Copy build to /docs
        run: npm run copy-build

      - name: Commit changes
        uses: EndBug/add-and-commit@v7
        with:
          author_name: GuyHarperDay
          author_email:
          message: 'New build, triggered by change to the master branch.'
          branch: github-pages
